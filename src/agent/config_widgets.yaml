gui:
  score: 
    status: true
  textBox:
    status: true
    title: "Key"
  pianoRoll:
    status: true
    human: true
    agent: true
  keyboard:
    status: true
    octaveStart: 1
    octaveEnd: 7
  chromaChart:
    status: false
  audioMeter: 
    status: false
  settingsModal:
    sliders:
      - id: 1 
        label: "Temperature"
        # 1 = practically always the network's top choice (what bachduet.com effectively does,
        # and what felt best in live A/B tests); higher values sample more freely
        value: 1
        min: 1
        max: 300
      # Anticipation: a role-swapped copy of the network predicts the user's next note and
      # BachDuet favours notes consonant with it (and stays on the other side of the user).
      # 0 turns it off.
      # Off by default: in live play it scored better in simulations but felt worse.
      - id: 2
        label: "Anticipation"
        value: 0
        min: 0
        max: 10
      # Avoid rests: how strongly BachDuet is steered away from resting. 0 turns it off.
      - id: 3
        label: "Avoid rests"
        value: 0
        min: 0
        max: 5
      # Imitation: now and then BachDuet answers your motif in imitation (an octave, 5th or 4th below,
      # after a beat or two), like the voices of an invention. 0 = off; higher = more often.
      - id: 4
        label: "Imitation"
        value: 0
        min: 0
        max: 10
    buttons:
      - id: 1
        label: "Reset"
      # Downloads the session (what you and BachDuet played, tick by tick) as JSON + MIDI
      - id: 2
        label: "Save session"
    # Dropdowns send the index of the selected option to the agent.
    # intro: true also shows the dropdown on the loading screen, next to the Play button.
    dropdowns:
      - id: 1
        label: "Starting key"
        intro: true
        value: 0
        options: ["C major", "C minor", "D♭ major", "C♯ minor", "D major", "D minor",
                  "E♭ major", "E♭ minor", "E major", "E minor", "F major", "F minor",
                  "F♯ major", "F♯ minor", "G major", "G minor", "A♭ major", "G♯ minor",
                  "A major", "A minor", "B♭ major", "B♭ minor", "B major", "B minor"]
      # Which network BachDuet uses (settings only); switching resets BachDuet like the Reset button.
      - id: 2
        label: "Model"
        value: 0
        options: ["BachDuet 2018 (deployed)", "BachDuet v2 (new)", "BachDuet v2 chorales (m2)",
                  "Frankenstein chorales", "RL cadence (long)", "RL β 0.3",
                  "RL Frankenstein (best)", "Transformer small (chorales)"]
      # How BachDuet answers in Imitation mode (the Imitation slider): Exact = the motif transposed note for note
      # (re-fitted to the current scale), Contour = same rhythm and melodic shape on notes the network likes,
      # Hybrid = Exact when the network accepts the note, else Contour. Notes that clash on strong beats or make
      # parallel 5ths/8ves are skipped (two skips end the answer).
      - id: 3
        label: "Imitation style"
        value: 2
        options: ["Exact", "Contour", "Hybrid"]
    dropdownsNote: "Starting key only sets how BachDuet starts (and what Reset returns to). It follows you when you modulate."